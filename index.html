<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESV - Sodicarga S.A.S</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2d3d;
      background-color: #ffffff;
    }
    /* Logo de fondo tenue (marca de agua) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: url("fondo-logo-sodicarga.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: min(90vw, 1200px) auto;
      opacity: 0.25;
    }
    header {
      width: 100%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header img {
      display: block;
      width: 100%;
      height: auto;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 16px;
      min-height: 70vh;
    }
    .titulo {
      text-align: center;
      color: #c8102e;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 1px;
      font-size: clamp(1.28rem, 3.2vw, 2.08rem);
    }
    .titulo span {
      display: block;
      color: #c8102e;
      font-size: 1.25em;
      margin-bottom: 6px;
    }
    /* Formulario */
    .formulario {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d5dbe3;
      border-top: 4px solid #c8102e;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .formulario h2 {
      font-size: 1.1rem;
      color: #0d3b78;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .campos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }
    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .campo label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1f2d3d;
    }
    .campo input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #b8c2cf;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2d3d;
    }
    .campo input:focus {
      outline: none;
      border-color: #c8102e;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.15);
    }
    #placa { text-transform: uppercase; }
    /* Módulos de inspección */
    .modulos {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      padding: 18px 20px 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .modulos h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
    }
    .grid-modulos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .modulo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 64px;
      padding: 10px 8px;
      background: #e3effc;
      border: 1px solid #a9c8ec;
      border-radius: 8px;
      color: #000000;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .modulo:hover { background: #d2e5fa; border-color: #7fb0e6; }
    .modulo .conteo {
      font-size: 0.8rem;
      font-weight: 400;
      color: #000000;
    }
    @media (max-width: 900px) {
      .grid-modulos { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .grid-modulos { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .campos { grid-template-columns: 1fr; }
      .formulario { padding: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="encabezado-sodicarga.png" alt="Sociedad Distribuidora de Carga Sodicarga S.A.S - NIT 802.014.991-4">
  </header>
  <main>
    <h1 class="titulo"><span>PESV</span>PREOPERACIONAL DE VEHÍCULOS</h1>

    <form class="formulario" id="preoperacional" autocomplete="off">
      <h2>Datos generales</h2>
      <div class="campos">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>
        <div class="campo">
          <label for="hora">Hora De Inspección</label>
          <input type="time" id="hora" name="hora" required>
        </div>
        <div class="campo">
          <label for="placa">Placa</label>
          <input type="text" id="placa" name="placa" maxlength="7" required placeholder="Ej: ABC123">
        </div>
        <div class="campo">
          <label for="tipo_vehiculo">Tipo De Vehículo</label>
          <input type="text" id="tipo_vehiculo" name="tipo_vehiculo" list="tipos" required placeholder="Ej: Tractocamión">
          <datalist id="tipos">
            <option value="Tractocamión">
            <option value="Camión sencillo">
            <option value="Doble troque">
            <option value="Furgón">
            <option value="Volqueta">
            <option value="Camioneta">
          </datalist>
        </div>
        <div class="campo">
          <label for="marca">Marca</label>
          <input type="text" id="marca" name="marca" required placeholder="Ej: Kenworth">
        </div>
        <div class="campo">
          <label for="modelo">Modelo</label>
          <input type="number" id="modelo" name="modelo" min="1950" max="2100" required placeholder="Ej: 2020">
        </div>
        <div class="campo">
          <label for="kilometraje">Kilometraje</label>
          <input type="number" id="kilometraje" name="kilometraje" min="0" inputmode="numeric" required placeholder="Ej: 125000">
        </div>
        <div class="campo">
          <label for="conductor">Conductor</label>
          <input type="text" id="conductor" name="conductor" required placeholder="Ej: Juan Pérez">
        </div>
        <div class="campo">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" name="cedula" inputmode="numeric" pattern="[0-9]+" required placeholder="Ej: 1234567890">
        </div>
        <div class="campo">
          <label for="empresa">Empresa/Propietario</label>
          <input type="text" id="empresa" name="empresa" required placeholder="Ej: Sodicarga S.A.S">
        </div>
        <div class="campo">
          <label for="cliente">Cliente/Servicio</label>
          <input type="text" id="cliente" name="cliente" required placeholder="Ej: Transporte de mercancía">
        </div>
        <div class="campo">
          <label for="origen">Origen</label>
          <input type="text" id="origen" name="origen" required placeholder="Ej: Barranquilla">
        </div>
        <div class="campo">
          <label for="destino">Destino</label>
          <input type="text" id="destino" name="destino" required placeholder="Ej: Bogotá">
        </div>
        <div class="campo">
          <label for="tipo_carga">Tipo De Carga</label>
          <input type="text" id="tipo_carga" name="tipo_carga" required placeholder="Ej: Carga seca">
        </div>
        <div class="campo">
          <label for="responsable">Responsable Inspección</label>
          <input type="text" id="responsable" name="responsable" required placeholder="Ej: María Gómez">
        </div>
      </div>
    </form>

    <section class="modulos">
      <h2>Selección de Módulos de Inspección</h2>
      <div class="grid-modulos">
        <button type="button" class="modulo">Documentación<span class="conteo">0/6</span></button>
        <button type="button" class="modulo">Estado Exterior<span class="conteo">0/11</span></button>
        <button type="button" class="modulo">Llantas<span class="conteo">0/9</span></button>
        <button type="button" class="modulo">Iluminación y señalización<span class="conteo">0/10</span></button>
        <button type="button" class="modulo">Sistemas Mecánicos<span class="conteo">0/9</span></button>
        <button type="button" class="modulo">Fluidos<span class="conteo">0/7</span></button>
        <button type="button" class="modulo">Seguridad Activa/Pasiva<span class="conteo">0/8</span></button>
        <button type="button" class="modulo">Equipo Prevención/Seguridad<span class="conteo">0/9</span></button>
        <button type="button" class="modulo">Compartimiento Carga<span class="conteo">0/12</span></button>
        <button type="button" class="modulo">Control Seguridad/Trazabilidad<span class="conteo">0/9</span></button>
      </div>
    </section>
  </main>

  <script>
    // Fecha y hora actuales por defecto
    (function () {
      var ahora = new Date();
      var p = function (n) { return String(n).padStart(2, "0"); };
      document.getElementById("fecha").value =
        ahora.getFullYear() + "-" + p(ahora.getMonth() + 1) + "-" + p(ahora.getDate());
      document.getElementById("hora").value = p(ahora.getHours()) + ":" + p(ahora.getMinutes());
    })();
  </script>
</body>
</html>
