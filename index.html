<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESV - Sodicarga S.A.S</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2d3d;
      background-color: #ffffff;
    }
    /* Logo de fondo tenue (marca de agua) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: url("fondo-logo-sodicarga.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: min(90vw, 1200px) auto;
      opacity: 0.25;
    }
    header {
      width: 100%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header img {
      display: block;
      width: 100%;
      height: auto;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 16px;
      min-height: 70vh;
    }
    .titulo {
      text-align: center;
      color: #c8102e;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 1px;
      font-size: clamp(1.28rem, 3.2vw, 2.08rem);
    }
    .titulo span {
      display: block;
      color: #c8102e;
      font-size: 1.25em;
      margin-bottom: 6px;
    }
    /* Formulario */
    .formulario {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d5dbe3;
      border-top: 4px solid #c8102e;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .formulario h2 {
      font-size: 1.1rem;
      color: #0d3b78;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .campos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }
    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .campo label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1f2d3d;
    }
    .campo input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #b8c2cf;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2d3d;
    }
    .campo input:focus {
      outline: none;
      border-color: #c8102e;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.15);
    }
    #placa { text-transform: uppercase; }
    /* Módulos de inspección */
    .modulos {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      padding: 18px 20px 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .modulos h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
    }
    .grid-modulos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .modulo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 64px;
      padding: 10px 8px;
      background: #e3effc;
      border: 1px solid #a9c8ec;
      border-radius: 8px;
      color: #000000;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .modulo:hover { background: #d2e5fa; border-color: #7fb0e6; }
    .modulo .conteo {
      font-size: 0.8rem;
      font-weight: 400;
      color: #000000;
    }
    .modulo.activo {
      background: #ffd400;
      border-color: #d4a900;
    }
    .modulo.activo:hover { background: #ffdb2e; }
    /* Módulo completo: verde claro */
    .modulo.completo {
      background: #c8f0c8;
      border-color: #7cc47c;
    }
    .modulo.completo:hover { background: #b8eab8; }
    .modulo.completo.activo {
      box-shadow: 0 0 0 3px #ffd400;
    }
    /* Detalle del módulo */
    .detalle {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      padding: 16px 18px 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .detalle[hidden] { display: none; }
    .detalle h3 {
      font-size: 1rem;
      color: #1a73c9;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #d5dbe3;
    }
    .item {
      border: 1px solid #d5dbe3;
      border-radius: 6px;
      padding: 10px 10px 12px;
      margin-bottom: 10px;
      background: #ffffff;
    }
    .item p {
      font-size: 0.85rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 8px;
    }
    .item-campos {
      display: grid;
      grid-template-columns: 120px 1fr 1fr;
      gap: 6px;
    }
    .item-campos select,
    .item-campos input {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      border: 1px solid #b8c2cf;
      border-radius: 4px;
      background: #ffffff;
      color: #000000;
    }
    .item-campos select:focus,
    .item-campos input:focus {
      outline: none;
      border-color: #1a73c9;
      box-shadow: 0 0 0 3px rgba(26, 115, 201, 0.15);
    }
    .sin-preguntas {
      font-size: 0.9rem;
      color: #555555;
    }
    @media (max-width: 640px) {
      .item-campos { grid-template-columns: 1fr; }
    }
    /* Resumen de calificación */
    .resumen {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      padding: 16px 20px 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .resumen h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #000000;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #b8c2cf;
    }
    .grid-resumen {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    .tarjeta {
      background: #ffffff;
      border: 1px solid #b8c2cf;
      border-radius: 6px;
      padding: 10px 8px;
      text-align: center;
    }
    .tarjeta .etiqueta {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 4px;
    }
    .tarjeta .valor {
      display: block;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .v-total { color: #c8102e; }
    .v-cumple { color: #1e9e3a; }
    .v-nocumple { color: #c8102e; }
    .v-noaplica { color: #e0a000; }
    .v-sin { color: #6b6b6b; }
    .v-porc { color: #0e9fb3; }
    @media (max-width: 900px) {
      .grid-resumen { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .grid-resumen { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .grid-modulos { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .grid-modulos { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .campos { grid-template-columns: 1fr; }
      .formulario { padding: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="encabezado-sodicarga.png" alt="Sociedad Distribuidora de Carga Sodicarga S.A.S - NIT 802.014.991-4">
  </header>
  <main>
    <h1 class="titulo"><span>PESV</span>PREOPERACIONAL DE VEHÍCULOS</h1>

    <form class="formulario" id="preoperacional" autocomplete="off">
      <h2>Datos generales</h2>
      <div class="campos">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>
        <div class="campo">
          <label for="hora">Hora De Inspección</label>
          <input type="time" id="hora" name="hora" required>
        </div>
        <div class="campo">
          <label for="placa">Placa</label>
          <input type="text" id="placa" name="placa" maxlength="7" required placeholder="Ej: ABC123">
        </div>
        <div class="campo">
          <label for="tipo_vehiculo">Tipo De Vehículo</label>
          <input type="text" id="tipo_vehiculo" name="tipo_vehiculo" list="tipos" required placeholder="Ej: Tractocamión">
          <datalist id="tipos">
            <option value="Tractocamión">
            <option value="Camión sencillo">
            <option value="Doble troque">
            <option value="Furgón">
            <option value="Volqueta">
            <option value="Camioneta">
          </datalist>
        </div>
        <div class="campo">
          <label for="marca">Marca</label>
          <input type="text" id="marca" name="marca" required placeholder="Ej: Kenworth">
        </div>
        <div class="campo">
          <label for="modelo">Modelo</label>
          <input type="number" id="modelo" name="modelo" min="1950" max="2100" required placeholder="Ej: 2020">
        </div>
        <div class="campo">
          <label for="kilometraje">Kilometraje</label>
          <input type="number" id="kilometraje" name="kilometraje" min="0" inputmode="numeric" required placeholder="Ej: 125000">
        </div>
        <div class="campo">
          <label for="conductor">Conductor</label>
          <input type="text" id="conductor" name="conductor" required placeholder="Ej: Juan Pérez">
        </div>
        <div class="campo">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" name="cedula" inputmode="numeric" pattern="[0-9]+" required placeholder="Ej: 1234567890">
        </div>
        <div class="campo">
          <label for="empresa">Empresa/Propietario</label>
          <input type="text" id="empresa" name="empresa" required placeholder="Ej: Sodicarga S.A.S">
        </div>
        <div class="campo">
          <label for="cliente">Cliente/Servicio</label>
          <input type="text" id="cliente" name="cliente" required placeholder="Ej: Transporte de mercancía">
        </div>
        <div class="campo">
          <label for="origen">Origen</label>
          <input type="text" id="origen" name="origen" required placeholder="Ej: Barranquilla">
        </div>
        <div class="campo">
          <label for="destino">Destino</label>
          <input type="text" id="destino" name="destino" required placeholder="Ej: Bogotá">
        </div>
        <div class="campo">
          <label for="tipo_carga">Tipo De Carga</label>
          <input type="text" id="tipo_carga" name="tipo_carga" required placeholder="Ej: Carga seca">
        </div>
        <div class="campo">
          <label for="responsable">Responsable Inspección</label>
          <input type="text" id="responsable" name="responsable" required placeholder="Ej: María Gómez">
        </div>
      </div>
    </form>

    <section class="modulos">
      <h2>Selección de Módulos de Inspección</h2>
      <div class="grid-modulos">
        <button type="button" class="modulo">Documentación<span class="conteo">0/6</span></button>
        <button type="button" class="modulo">Estado Exterior<span class="conteo">0/11</span></button>
        <button type="button" class="modulo">Llantas<span class="conteo">0/9</span></button>
        <button type="button" class="modulo">Iluminación y señalización<span class="conteo">0/10</span></button>
        <button type="button" class="modulo">Sistemas Mecánicos<span class="conteo">0/9</span></button>
        <button type="button" class="modulo">Fluidos<span class="conteo">0/7</span></button>
        <button type="button" class="modulo">Seguridad Activa/Pasiva<span class="conteo">0/8</span></button>
        <button type="button" class="modulo">Equipo Prevención/Seguridad<span class="conteo">0/9</span></button>
        <button type="button" class="modulo">Compartimiento Carga<span class="conteo">0/12</span></button>
        <button type="button" class="modulo">Control Seguridad/Trazabilidad<span class="conteo">0/9</span></button>
      </div>
      <div id="detalles"></div>
    </section>

    <section class="resumen">
      <h2>Resumen de Calificación del Checklist</h2>
      <div class="grid-resumen">
        <div class="tarjeta"><span class="etiqueta">Total Ítems</span><span class="valor v-total" id="r-total">0</span></div>
        <div class="tarjeta"><span class="etiqueta">Cumple</span><span class="valor v-cumple" id="r-cumple">0</span></div>
        <div class="tarjeta"><span class="etiqueta">No Cumple</span><span class="valor v-nocumple" id="r-nocumple">0</span></div>
        <div class="tarjeta"><span class="etiqueta">No Aplica</span><span class="valor v-noaplica" id="r-noaplica">0</span></div>
        <div class="tarjeta"><span class="etiqueta">Sin responder</span><span class="valor v-sin" id="r-sin">0</span></div>
        <div class="tarjeta"><span class="etiqueta">% Cumplimiento</span><span class="valor v-porc" id="r-porc">0.0%</span></div>
      </div>
    </section>
  </main>

  <script>
    // Fecha y hora actuales por defecto
    (function () {
      var ahora = new Date();
      var p = function (n) { return String(n).padStart(2, "0"); };
      document.getElementById("fecha").value =
        ahora.getFullYear() + "-" + p(ahora.getMonth() + 1) + "-" + p(ahora.getDate());
      document.getElementById("hora").value = p(ahora.getHours()) + ":" + p(ahora.getMinutes());
    })();
  </script>
  <script>
    // Módulos de inspección
    (function () {
      var preguntas = {
        "Documentación": [
          "Licencia de tránsito disponible y vigente",
          "SOAT vigente",
          "Revisión técnico-mecánica vigente, cuando aplique",
          "Licencia de conducción vigente y categoría correspondiente",
          "Documentos adicionales exigidos para la operación",
          "Documentación de la carga disponible"
        ],
        "Estado Exterior": [
          "Carrocería en buen estado",
          "Chasis sin daños visibles",
          "Parachoques delantero",
          "Parachoques trasero",
          "Puertas y mecanismos de cierre",
          "Vidrios en buen estado",
          "Parabrisas sin daños que afecten visibilidad",
          "Placas legibles y correctamente instaladas",
          "Retrovisores/espejos en buen estado",
          "Limpiaparabrisas funcionando",
          "No se evidencian fugas de fluidos"
        ],
        "Llantas": [
          "Llanta delantera izquierda",
          "Llanta delantera derecha",
          "Llantas traseras",
          "Llantas sin deformaciones o cortes",
          "Profundidad de labrado adecuada",
          "Presión de inflado adecuada",
          "Tuercas y elementos de fijación completos",
          "Llanta de repuesto disponible y en condiciones",
          "No existen objetos incrustados que comprometan la seguridad"
        ],
        "Iluminación y señalización": [
          "Luces bajas",
          "Luces altas",
          "Luces de posición",
          "Direccionales delanteras",
          "Direccionales traseras",
          "Luces de freno",
          "Luces de reversa",
          "Luces estacionarias/emergencia",
          "Luz de placa",
          "Reflectivos en buen estado"
        ],
        "Sistemas Mecánicos": [
          "Sistema de frenos",
          "Freno de estacionamiento",
          "Dirección",
          "Suspensión",
          "Amortiguadores",
          "Sistema de transmisión",
          "Embrague, cuando aplique",
          "Motor sin ruidos anormales",
          "No se evidencian fugas"
        ],
        "Fluidos": [
          "Nivel de aceite del motor",
          "Líquido refrigerante",
          "Líquido de frenos",
          "Líquido hidráulico, cuando aplique",
          "Agua/líquido limpiaparabrisas",
          "Combustible suficiente para la operación",
          "Sin fugas visibles"
        ],
        "Seguridad Activa/Pasiva": [
          "Cinturón conductor en buen estado",
          "Cinturones de pasajeros, cuando aplique",
          "Sillas y apoyacabezas en buen estado",
          "Airbags/testigos sin anomalías visibles",
          "Sistema ABS/testigo sin anomalías, cuando aplique",
          "Bocina funcionando",
          "Alarma de reversa, cuando aplique",
          "Cámara/sensores de reversa, cuando aplique"
        ],
        "Equipo Prevención/Seguridad": [
          "Extintor disponible",
          "Extintor con carga vigente",
          "Botiquín",
          "Señales/dispositivos reflectivos de emergencia",
          "Gato",
          "Cruceta/herramienta para cambio de llanta",
          "Linterna",
          "Kit de carretera completo",
          "Herramientas básicas"
        ],
        "Compartimiento Carga": [
          "Carrocería/contenedor en buen estado",
          "Puertas de carga funcionan correctamente",
          "Cerraduras funcionan correctamente",
          "Piso en buen estado",
          "Paredes y techo sin daños",
          "Sin elementos extraños dentro del compartimiento",
          "Ausencia de modificaciones no autorizadas",
          "Sistema de sujeción de carga disponible",
          "Carga correctamente distribuida",
          "Carga correctamente asegurada",
          "Sellos/cintas de seguridad, cuando aplique",
          "Número de sello registrado, cuando aplique"
        ],
        "Control Seguridad/Trazabilidad": [
          "GPS/satelital funcionando",
          "Botón de pánico, cuando aplique",
          "Sistema de comunicación disponible",
          "Número de teléfono de tráfico/control disponible",
          "Vehículo autorizado para el servicio",
          "Conductor autorizado para el servicio",
          "Ruta autorizada",
          "Elementos de seguridad de la carga verificados",
          "No se evidencian condiciones inseguras"
        ]
      };
      var botones = document.querySelectorAll(".modulo");
      var contenedor = document.getElementById("detalles");
      var paneles = {};

      function crearPanel(nombre, total) {
        var panel = document.createElement("div");
        panel.className = "detalle";
        panel.hidden = true;
        var h3 = document.createElement("h3");
        h3.textContent = "Detalle: " + nombre;
        panel.appendChild(h3);
        var lista = preguntas[nombre];
        if (!lista) {
          var p = document.createElement("p");
          p.className = "sin-preguntas";
          p.textContent = "Las " + total + " preguntas de este módulo están pendientes por definir.";
          panel.appendChild(p);
        } else {
          lista.forEach(function (texto, i) {
            var item = document.createElement("div");
            item.className = "item";
            item.innerHTML =
              '<p></p>' +
              '<div class="item-campos">' +
                '<select><option value="">Seleccione...</option><option>Cumple</option><option>No cumple</option><option>No aplica</option></select>' +
                '<input type="text" placeholder="Observaciones">' +
                '<input type="text" placeholder="Acción/responsable">' +
              '</div>';
            item.querySelector("p").textContent = (i + 1) + ". " + texto;
            panel.appendChild(item);
          });
        }
        contenedor.appendChild(panel);
        return panel;
      }

      function actualizarConteo(boton, panel) {
        var selects = panel.querySelectorAll("select");
        if (!selects.length) return;
        var respondidas = 0;
        selects.forEach(function (s) { if (s.value) respondidas++; });
        boton.querySelector(".conteo").textContent = respondidas + "/" + selects.length;
        boton.classList.toggle("completo", respondidas === selects.length);
      }

      botones.forEach(function (boton) {
        var nombre = boton.firstChild.textContent.trim();
        var total = boton.querySelector(".conteo").textContent.split("/")[1];
        var panel = crearPanel(nombre, total);
        paneles[nombre] = panel;
        panel.addEventListener("change", function () { actualizarConteo(boton, panel); });
        boton.addEventListener("click", function () {
          // Si el módulo ya está abierto, solo se ocultan las preguntas (el color no cambia)
          if (boton.classList.contains("activo") && !panel.hidden) {
            panel.hidden = true;
            return;
          }
          botones.forEach(function (b) { b.classList.remove("activo"); });
          Object.keys(paneles).forEach(function (k) { paneles[k].hidden = true; });
          boton.classList.add("activo");
          panel.hidden = false;
        });
      });
    })();
  </script>
  <script>
    // Resumen de calificación del checklist
    (function () {
      var detalles = document.getElementById("detalles");
      function calcular() {
        var selects = detalles.querySelectorAll("select");
        var c = { total: selects.length, cumple: 0, nocumple: 0, noaplica: 0, sin: 0 };
        selects.forEach(function (s) {
          if (s.value === "Cumple") c.cumple++;
          else if (s.value === "No cumple") c.nocumple++;
          else if (s.value === "No aplica") c.noaplica++;
          else c.sin++;
        });
        var aplicables = c.total - c.noaplica;
        var porc = aplicables > 0 ? (c.cumple / aplicables) * 100 : 0;
        document.getElementById("r-total").textContent = c.total;
        document.getElementById("r-cumple").textContent = c.cumple;
        document.getElementById("r-nocumple").textContent = c.nocumple;
        document.getElementById("r-noaplica").textContent = c.noaplica;
        document.getElementById("r-sin").textContent = c.sin;
        document.getElementById("r-porc").textContent = porc.toFixed(1) + "%";
      }
      detalles.addEventListener("change", calcular);
      calcular();
    })();
  </script>
</body>
</html>
