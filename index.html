<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESV - Sodicarga S.A.S</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2d3d;
      background-color: #ffffff;
    }
    /* Logo de fondo tenue (marca de agua) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: url("fondo-logo-sodicarga.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: min(90vw, 1200px) auto;
      opacity: 0.25;
    }
    header {
      width: 100%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header img {
      display: block;
      width: 100%;
      height: auto;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 16px;
      min-height: 70vh;
    }
  </style>
</head>
<body>
  <header>
    <img src="encabezado-sodicarga.png" alt="Sociedad Distribuidora de Carga Sodicarga S.A.S - NIT 802.014.991-4">
